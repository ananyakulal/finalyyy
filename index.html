<script>
// Demo room codes. Change these before using the demo.
const roomCodes = {
    "Room 1": "ROOM101",
    "Room 2": "ROOM202",
    "Room 3": "ROOM303",
    "Room 4": "ROOM404",
    "Room 5": "ROOM505",
    "Room 6": "ROOM606"
};

let currentRoom = "";

function getEntries() {
    try {
        return JSON.parse(localStorage.getItem("hostelFoodEntries") || "[]");
    } catch (error) {
        return [];
    }
}

function setEntries(entries) {
    localStorage.setItem("hostelFoodEntries", JSON.stringify(entries));
}

function removeExpiredEntries() {
    const cutoff = Date.now() - 24 * 60 * 60 * 1000;
    setEntries(getEntries().filter(entry => entry.timestamp > cutoff));
}

function enterRoom() {
    const room = document.getElementById("room").value;
    const code = document.getElementById("roomCode").value;

    if (!room) {
        alert("Please select your room.");
        return;
    }

    if (code !== roomCodes[room]) {
        alert("Incorrect room code!");
        return;
    }

    currentRoom = room;
    document.getElementById("foodSection").style.display = "block";
    document.getElementById("roomTitle").textContent = "🍽️ " + room;
    renderEntries();
}

function saveEntry() {
    const name = document.getElementById("studentName").value.trim();

    if (!name) {
        alert("Please enter your name.");
        return;
    }

    const entries = getEntries();

    // One entry per student name in each room.
    const existingIndex = entries.findIndex(entry =>
        entry.room === currentRoom &&
        entry.name.toLowerCase() === name.toLowerCase()
    );

    const newEntry = {
        room: currentRoom,
        name: name,
        breakfast: document.getElementById("breakfast").value,
        morningTea: document.getElementById("morningTea").value,
        lunch: document.getElementById("lunch").value,
        snacks: document.getElementById("snacks").value,
        eveningTea: document.getElementById("eveningTea").value,
        dinner: document.getElementById("dinner").value,
        sweet: document.getElementById("sweet").value,
        timestamp: Date.now()
    };

    if (existingIndex >= 0) {
        entries[existingIndex] = newEntry;
    } else {
        entries.push(newEntry);
    }

    setEntries(entries);
    document.getElementById("studentName").value = "";
    renderEntries();
    alert("Food details saved!");
}

function renderEntries() {
    removeExpiredEntries();

    const entries = getEntries().filter(entry => entry.room === currentRoom);
    const entriesDiv = document.getElementById("entries");

    entriesDiv.innerHTML = "";

    if (entries.length === 0) {
        entriesDiv.textContent = "No students have submitted their food choices yet.";
    }

    entries.forEach(entry => {
        const card = document.createElement("div");
        card.className = "entry";

        const details = document.createElement("div");
        details.textContent =
            entry.name +
            " — Breakfast: " + entry.breakfast +
            " | Morning tea: " + entry.morningTea +
            " | Lunch: " + entry.lunch +
            " | Snacks: " + entry.snacks +
            " | Evening tea: " + entry.eveningTea +
            " | Dinner: " + entry.dinner +
            " | Sweet: " + entry.sweet;

        const removeButton = document.createElement("button");
        removeButton.className = "small-button";
        removeButton.textContent = "Delete Entry";
        removeButton.onclick = function () {
            if (confirm("Delete this entry?")) {
                setEntries(getEntries().filter(item =>
                    !(item.room === currentRoom &&
                      item.name === entry.name)
                ));
                renderEntries();
            }
        };

        card.appendChild(details);
        card.appendChild(removeButton);
        entriesDiv.appendChild(card);
    });

    const count = {
        students: entries.length,
        breakfast: 0,
        morningTea: 0,
        diningHall: 0,
        tiffinBox: 0,
        snacks: 0,
        eveningTea: 0,
        veg: 0,
        nonveg: 0,
        sweet: 0
    };

    entries.forEach(entry => {
        if (entry.breakfast === "Yes") count.breakfast++;
        if (entry.morningTea === "Yes") count.morningTea++;
        if (entry.lunch === "Dining Hall") count.diningHall++;
        if (entry.lunch === "Tiffin Box") count.tiffinBox++;
        if (entry.snacks === "Yes") count.snacks++;
        if (entry.eveningTea === "Yes") count.eveningTea++;
        if (entry.dinner === "Veg") count.veg++;
        if (entry.dinner === "Non-veg") count.nonveg++;
        if (entry.sweet === "Yes") count.sweet++;
    });

    document.getElementById("counts").textContent =
        "Total students: " + count.students +
        " | Breakfast: " + count.breakfast +

        " | Dining Hall lunch: " + count.diningHall +
        " | Tiffin Box: " + count.tiffinBox +
